<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="204" viewBox="0 0 1200 204" role="img" aria-labelledby="title"><title id="title">五步完成 Mac 安裝：工具、專案、環境、啟動、模型</title><rect width="1200" height="204" rx="16" fill="#f1f5fb"/><g font-family="PingFang TC, Noto Sans CJK TC, sans-serif"><rect x="20" y="20" width="212" height="160" rx="12" fill="white" stroke="#cfdaea"/><circle cx="51" cy="52" r="17" fill="#2b4098"/><text x="40" y="58" font-size="15" fill="white">01</text><text x="36" y="104" font-size="24" font-weight="600" fill="#182b36">安裝工具</text><text x="36" y="142" font-size="14" fill="#536880">Python 3.11 + Ollama</text><path d="M 238 100 h 13 m -5 -5 5 5 -5 5" stroke="#7486a4" fill="none" stroke-width="2"/><rect x="257" y="20" width="212" height="160" rx="12" fill="white" stroke="#cfdaea"/><circle cx="288" cy="52" r="17" fill="#2b4098"/><text x="277" y="58" font-size="15" fill="white">02</text><text x="273" y="104" font-size="24" font-weight="600" fill="#182b36">取得專案</text><text x="273" y="142" font-size="14" fill="#536880">Clone 或 Download ZIP</text><path d="M 475 100 h 13 m -5 -5 5 5 -5 5" stroke="#7486a4" fill="none" stroke-width="2"/><rect x="494" y="20" width="212" height="160" rx="12" fill="white" stroke="#cfdaea"/><circle cx="525" cy="52" r="17" fill="#2b4098"/><text x="514" y="58" font-size="15" fill="white">03</text><text x="510" y="104" font-size="24" font-weight="600" fill="#182b36">建立環境</text><text x="510" y="142" font-size="14" fill="#536880">雙擊 install.command</text><path d="M 712 100 h 13 m -5 -5 5 5 -5 5" stroke="#7486a4" fill="none" stroke-width="2"/><rect x="731" y="20" width="212" height="160" rx="12" fill="white" stroke="#cfdaea"/><circle cx="762" cy="52" r="17" fill="#2b4098"/><text x="751" y="58" font-size="15" fill="white">04</text><text x="747" y="104" font-size="24" font-weight="600" fill="#182b36">啟動程式</text><text x="747" y="142" font-size="14" fill="#536880">雙擊 run.command</text><path d="M 949 100 h 13 m -5 -5 5 5 -5 5" stroke="#7486a4" fill="none" stroke-width="2"/><rect x="968" y="20" width="212" height="160" rx="12" fill="white" stroke="#cfdaea"/><circle cx="999" cy="52" r="17" fill="#2b4098"/><text x="988" y="58" font-size="15" fill="white">05</text><text x="984" y="104" font-size="24" font-weight="600" fill="#182b36">下載模型</text><text x="984" y="142" font-size="14" fill="#536880">設定 → 模型下載與說明</text></g></svg>